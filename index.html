<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover so the safe-area insets the layout relies on resolve
         on notched iPhones; without it `pt-safe`/`pb-safe` compute to zero. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF9" />
    <meta name="google-site-verification" content="googlec15061953ac76914.html" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="iléSure — Find your sure home anywhere. Verified student housing, off-campus apartments, and roommate matching." />
    <meta name="keywords" content="student housing, off-campus housing, apartments, rent, roommate, student accommodation, Lead City University, UI, Lautech" />
    <meta name="author" content="iléSure" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ilesure.com/" />
    <meta property="og:title" content="iléSure: Your Sure Home Anywhere" />
    <meta property="og:description" content="Find your sure home anywhere. Verified student housing, off-campus apartments, and roommate matching." />
    <meta property="og:image" content="/favicon.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ilesure.com/" />
    <meta property="twitter:title" content="iléSure: Your Sure Home Anywhere" />
    <meta property="twitter:description" content="Find your sure home anywhere. Verified student housing, off-campus apartments, and roommate matching." />
    <meta property="twitter:image" content="/favicon.png" />
    
    <link rel="apple-touch-icon" href="/favicon.png">
    <!-- Without these the app launches inside Safari's chrome rather than as a
         standalone PWA, which is also where the sign-in AutoFill sheet behaves
         least predictably. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="iléSure">
    
    <title>iléSure Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-textPrimary antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
